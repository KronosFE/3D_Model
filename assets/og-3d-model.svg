<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Space Grotesk',system-ui,sans-serif">
  <!-- background (flat brand, subtle vignette rings — no gradients/glow/teal) -->
  <rect width="1200" height="630" fill="#1b232e"/>
  <rect width="1200" height="630" fill="#232c39" opacity="0.5"/>
  <g stroke="#2f3a48" fill="none" opacity="0.6">
    <circle cx="965" cy="315" r="210"/><circle cx="965" cy="315" r="150"/><circle cx="965" cy="315" r="90"/>
  </g>
  <!-- reactor motif: negative-triangularity plasma D + TF coil hints -->
  <g transform="translate(965,315)">
    <g stroke="#3a4653" stroke-width="4" fill="none" opacity="0.85">
      <ellipse rx="60" ry="180" transform="rotate(0)"/>
      <ellipse rx="60" ry="180" transform="rotate(60)"/>
      <ellipse rx="60" ry="180" transform="rotate(120)"/>
    </g>
    <path d="M-4,-120 C 58,-110 68,-40 68,0 C 68,44 52,110 -6,120 C -52,110 -58,44 -58,0 C -58,-44 -58,-110 -4,-120 Z" fill="#e94f9c" opacity="0.30" stroke="#e94f9c" stroke-width="3"/>
    <rect x="-9" y="-190" width="18" height="380" rx="4" fill="#2f3945" stroke="#4a5563"/>
  </g>
  <!-- emblem -->
  <g transform="translate(90,86)">
    <circle cx="30" cy="30" r="27" stroke="#d3ac5f" stroke-width="2.2" fill="none"/>
    <circle cx="30" cy="30" r="10" fill="#e94f9c"/>
    <ellipse cx="30" cy="30" rx="24" ry="10" stroke="#d3ac5f" stroke-width="1.8" fill="none" transform="rotate(30 30 30)"/>
    <ellipse cx="30" cy="30" rx="24" ry="10" stroke="#d3ac5f" stroke-width="1.8" fill="none" transform="rotate(-30 30 30)"/>
  </g>
  <text x="168" y="108" fill="#e0e5eb" font-size="26" font-weight="700" letter-spacing="6">KRONOS FUSION ENERGY</text>
  <text x="168" y="136" fill="#9aa6b4" font-size="15" letter-spacing="8" font-family="'Space Mono',monospace">OPEN · REPRODUCIBLE FUSION</text>
  <!-- headline -->
  <text x="88" y="300" fill="#e0e5eb" font-size="92" font-weight="700" letter-spacing="-1">The Kronos <tspan fill="#d3ac5f">3D Model</tspan></text>
  <text x="90" y="360" fill="#c3ccd6" font-size="30" font-weight="400">An interactive 3-D model of two fusion machines —</text>
  <text x="90" y="400" fill="#c3ccd6" font-size="30" font-weight="400">run the real physics, verify every number.</text>
  <!-- machine chips -->
  <g font-family="'Space Mono',monospace" font-size="19">
    <rect x="90" y="440" width="290" height="46" rx="9" fill="#2a3441" stroke="#d3ac5f" stroke-opacity="0.5"/>
    <text x="112" y="469" fill="#d3ac5f">◈ BREEDER · Hyperion</text>
    <rect x="398" y="440" width="360" height="46" rx="9" fill="#2a3441" stroke="#e94f9c" stroke-opacity="0.5"/>
    <text x="420" y="469" fill="#e94f9c">◆ BURNER · Aegis / MetroVolt</text>
  </g>
  <!-- footer -->
  <text x="90" y="560" fill="#6fce9f" font-size="19" font-family="'Space Mono',monospace">182 / 182 reproducible · 5 open datasets (CC BY)</text>
  <text x="90" y="590" fill="#9aa6b4" font-size="17" font-family="'Space Mono',monospace">kronosfusionenergy.com/3D_Model</text>
</svg>
