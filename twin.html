<style>
:root{--bg:#232c39;--screen:#1b232e;--panel:#323e4d;--panel2:#2a3441;--gold:#d3ac5f;--pink:#e94f9c;
  --ink:#e0e5eb;--dim:#9aa6b4;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --fh:'Space Grotesk',system-ui,sans-serif;--fm:'Space Mono',monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fh)}
header.master{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 20px;background:rgba(27,35,46,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.14em;font-size:13px}
.brand small{display:block;font-weight:400;letter-spacing:.26em;color:var(--dim);font-size:9px;margin-top:1px}
.emblem{width:26px;height:26px}
.spacer{flex:1}
.mtoggle{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;font-family:var(--fm)}
.mtoggle button{background:transparent;color:var(--dim);border:0;padding:7px 15px;font-size:11px;letter-spacing:.08em;cursor:pointer;font-family:var(--fm)}
.mtoggle button.on[data-m=breeder]{background:var(--gold);color:#20160a}
.mtoggle button.on[data-m=burner]{background:var(--pink);color:#1a0d15}
.fidelity{display:flex;gap:2px;font-family:var(--fm);font-size:9.5px}
.fidelity button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);padding:5px 9px;cursor:pointer;font-family:var(--fm);font-size:9.5px}
.fidelity button.on{background:var(--panel);color:var(--gold);border-color:var(--gold)}
.fidelity button:first-child{border-radius:5px 0 0 5px}.fidelity button:last-child{border-radius:0 5px 5px 0}
.sandbox{font-family:var(--fm);font-size:9px;letter-spacing:.12em;color:var(--gold);border:1px solid rgba(211,172,95,.4);border-radius:4px;padding:3px 7px}
.hero{height:74vh;min-height:460px;border-bottom:1px solid var(--line);position:relative}
.hero iframe{width:100%;height:100%;border:0;display:block}
.divlabel{display:flex;align-items:center;gap:14px;padding:22px 24px 6px;max-width:1220px;margin:0 auto}
.divlabel .t{font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.divlabel .l{flex:1;height:1px;background:var(--line)}
.details iframe{width:100%;height:calc(100vh - 8px);border:0;display:block}
.scrollcue{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:var(--fm);font-size:10px;
  color:var(--dim);background:rgba(27,35,46,.7);border:1px solid var(--line);border-radius:20px;padding:6px 14px;pointer-events:none}
</style>

<header class="master">
  <div class="brand">
    <svg class="emblem" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="#d3ac5f" stroke-width="1.4"/><circle cx="20" cy="20" r="6.5" fill="#e94f9c"/><ellipse cx="20" cy="20" rx="16" ry="6.5" stroke="#d3ac5f" stroke-width="1.2" transform="rotate(30 20 20)"/><ellipse cx="20" cy="20" rx="16" ry="6.5" stroke="#d3ac5f" stroke-width="1.2" transform="rotate(-30 20 20)"/></svg>
    <div>KRONOS FUSION ENERGY<small>3D MODEL</small></div>
  </div>
  <div class="mtoggle" id="mtoggle">
    <button data-m="breeder" class="on" onclick="setM('breeder')">◈ BREEDER · HYPERION</button>
    <button data-m="burner" onclick="setM('burner')">◆ BURNER · AEGIS / METROVOLT</button>
  </div>
  <div class="fidelity" id="fidelity">
    <button class="on" data-f="Designed" onclick="setF('Designed',this)">As-Designed</button>
    <button data-f="Simulated" onclick="setF('Simulated',this)">As-Simulated</button>
    <button data-f="Operating" onclick="setF('Operating',this)">As-Operating</button>
  </div>
  <div class="spacer"></div>
  <span class="sandbox">Sandbox · noindex</span>
</header>

<div class="hero">
  <iframe id="f3d" src="twin_3d_reactor.html?embed=1" title="3D reactor"></iframe>
  <div class="scrollcue">▾ scroll for full analysis &amp; measurements</div>
</div>

<div class="divlabel"><span class="t">Analysis &amp; Measurements</span><span class="l"></span></div>
<div class="details">
  <iframe id="fdet" src="twin_rebuild_core_physics.html?embed=1" title="Detail sections"></iframe>
</div>

<script>
var M='breeder',FID='Designed';
function frames(){return [document.getElementById('f3d').contentWindow,document.getElementById('fdet').contentWindow];}
function post(msg){frames().forEach(function(w){try{w.postMessage(msg,'*');}catch(e){}});}
function setM(m){M=m;
  document.querySelectorAll('#mtoggle button').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
  post({kfeMachine:m});}
function setF(f,el){FID=f;document.querySelectorAll('#fidelity button').forEach(function(b){b.classList.remove('on');});el.classList.add('on');
  document.getElementById('f3d').contentWindow.postMessage({kfeFidelity:f},'*');}
// push current state once each frame loads
['f3d','fdet'].forEach(function(id){document.getElementById(id).addEventListener('load',function(){
  setTimeout(function(){this.contentWindow.postMessage({kfeMachine:M,kfeFidelity:FID},'*');}.bind(this),300);});});
</script>
